name: claricase-platform

services:
  # Product-first issue classification. Independent of the older /choose stage.
  issue-api:
    profiles: ["issues"]
    build:
      context: ..
      dockerfile: platform/services/issue-api/Dockerfile
    image: claricase/issue-api:dev
    environment:
      ISSUE_BACKEND: ${ISSUE_BACKEND:-openai_compat}
      ISSUE_BASE_URL: ${ISSUE_BASE_URL:-https://api.groq.com/openai/v1}
      ISSUE_API_KEY: ${ISSUE_API_KEY:-}
      ISSUE_MODEL: ${ISSUE_MODEL:-}
      ISSUE_RESPONSE_FORMAT: ${ISSUE_RESPONSE_FORMAT:-json_object}
      ISSUE_TIMEOUT_S: ${ISSUE_TIMEOUT_S:-25}
      ISSUE_CONCURRENCY: ${ISSUE_CONCURRENCY:-4}
      ISSUE_MAX_OUTPUT_TOKENS: ${ISSUE_MAX_OUTPUT_TOKENS:-800}
      ISSUE_PRODUCT_URL: ${ISSUE_PRODUCT_URL:-http://ensemble-api:8000}
      ISSUE_PRODUCT_TIMEOUT_S: ${ISSUE_PRODUCT_TIMEOUT_S:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${ISSUE_API_PORT:-8081}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  svm-api:
    build:
      context: ..
      dockerfile: platform/services/svm-api/Dockerfile
    image: claricase/svm-api:dev
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      MODEL_PATH: ${MODEL_PATH}
      BASELINE2_MODEL_PATH: ${BASELINE2_MODEL_PATH:-/app/docs/metrics/baseline_model_2/model.joblib}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz',timeout=2).getcode()==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  router:
    build:
      context: ..
      dockerfile: platform/services/router/Dockerfile
    image: claricase/router:dev
    environment:
      PRIMARY_URL: ${PRIMARY_URL}
      # Optional: tried once when PRIMARY_URL is down. Empty disables it.
      FALLBACK_URL: ${FALLBACK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      # GET /explain/{request_id} is proxied here.
      ENSEMBLE_API_URL: ${ENSEMBLE_API_URL:-http://ensemble-api:8000}
    ports:
      - "${ROUTER_PORT}:8000"
    depends_on:
      svm-api:
        condition: service_healthy

  # ---- Opt-in model services (profile "ensemble") --------------------------
  # Not started by plain `docker compose up`, so the Phase 1 slice is unchanged.
  # Both need trained artifacts first; see platform/README.md.
  embed-api:
    profiles: ["ensemble"]
    build:
      context: ..
      dockerfile: platform/services/embed-api/Dockerfile
      args:
        ENCODER_NAME: ${ENCODER_NAME:-BAAI/bge-small-en-v1.5}
    image: claricase/embed-api:dev
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KNN_INDEX_PATH: /app/data/cache/knn_embed/index.npz
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # IM2 sentence occlusion. Empty defaults: the explainer's own defaults
      # (enabled, K = 20) apply.
      EXPLAIN_OCCLUSION_ENABLED: ${EXPLAIN_OCCLUSION_ENABLED:-}
      EXPLAIN_OCCLUSION_K: ${EXPLAIN_OCCLUSION_K:-}
    # The nearest-neighbour index (~200 MB, written by
    # `python -m src.ensemble.export_predictions`) is mounted, not baked in.
    # Without it embed-api still serves improved_model_2 and ensemble-api
    # falls back to the primary-alone policy.
    volumes:
      - ../data/cache/knn_embed:/app/data/cache/knn_embed:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz',timeout=2).getcode()==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  ensemble-api:
    profiles: ["ensemble"]
    build:
      context: ..
      dockerfile: platform/services/ensemble-api/Dockerfile
    image: claricase/ensemble-api:dev
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SVM_API_URL: ${SVM_API_URL:-http://svm-api:8000}
      EMBED_API_URL: ${EMBED_API_URL:-http://embed-api:8000}
      UPSTREAM_TIMEOUT_S: ${UPSTREAM_TIMEOUT_S:-4.0}
      LABEL_SHIFT_ENABLED: ${LABEL_SHIFT_ENABLED:-true}
      PRIOR_WINDOW: ${PRIOR_WINDOW:-5000}
      PRIOR_MIN_ROWS: ${PRIOR_MIN_ROWS:-500}
      PRIOR_REFRESH: ${PRIOR_REFRESH:-100}
      AGENTIC_URL: ${AGENTIC_URL:-}
      AGENTIC_TIMEOUT_S: ${AGENTIC_TIMEOUT_S:-3.0}
      AGENTIC_ISSUE_GAP: ${AGENTIC_ISSUE_GAP:-0.3}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      EXPLANATIONS_ENABLED: ${EXPLANATIONS_ENABLED:-true}
      # Narrator settings. Empty compose defaults so the defaults in
      # src/explain/config.py always apply when a variable is unset.
      EXPLAIN_BACKEND: ${EXPLAIN_BACKEND:-}
      EXPLAIN_BASE_URL: ${EXPLAIN_BASE_URL:-}
      EXPLAIN_API_KEY: ${EXPLAIN_API_KEY:-}
      EXPLAIN_MODEL: ${EXPLAIN_MODEL:-}
      EXPLAIN_TIMEOUT_S: ${EXPLAIN_TIMEOUT_S:-}
      EXPLAIN_AUDIENCES: ${EXPLAIN_AUDIENCES:-}
      EXPLAIN_INCLUDE_TEXT: ${EXPLAIN_INCLUDE_TEXT:-}
      EXPLAIN_AGENT_TOKEN: ${EXPLAIN_AGENT_TOKEN:-}
      EXPLAIN_MAX_TOKENS: ${EXPLAIN_MAX_TOKENS:-}
      EXPLAIN_MOCK_MODE: ${EXPLAIN_MOCK_MODE:-}
      EXPLAIN_MOCK_DELAY_S: ${EXPLAIN_MOCK_DELAY_S:-}
    volumes:
      - ../docs/metrics/agentic:/app/docs/metrics/agentic:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz',timeout=3).getcode()==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      svm-api:
        condition: service_healthy
      embed-api:
        condition: service_healthy

  # ---- Opt-in LLM stage (profile "agentic") --------------------------------
  # Needs an LLM endpoint key in .env and the example pool from
  # `python -m src.agentic.run` (or src.agentic.examples). Point ensemble-api
  # at it with AGENTIC_URL=http://agentic-api:8000 and raise the router's
  # PRIMARY_TIMEOUT_S (two extra calls per reviewed complaint).
  agentic-api:
    profiles: ["agentic"]
    build:
      context: ..
      dockerfile: platform/services/agentic-api/Dockerfile
      args:
        ENCODER_NAME: ${ENCODER_NAME:-BAAI/bge-small-en-v1.5}
    image: claricase/agentic-api:dev
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENTIC_BACKEND: ${AGENTIC_BACKEND:-openai_compat}
      AGENTIC_BASE_URL: ${AGENTIC_BASE_URL:-https://api.groq.com/openai/v1}
      AGENTIC_API_KEY: ${AGENTIC_API_KEY:-}
      AGENTIC_MODEL: ${AGENTIC_MODEL:-llama-3.3-70b-versatile}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ../data/cache/agentic:/app/data/cache/agentic
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz',timeout=2).getcode()==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
