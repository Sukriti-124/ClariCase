[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embed-api"
version = "0.0.1"
description = "ClariCase embed-api: serves improved_model_2 (sentence embeddings + logistic regression)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.29,<1",
    "pydantic-settings>=2.2,<3",
    "scikit-learn==1.9.1",   # MUST match the version the model was saved with
    "joblib>=1.3,<2",
    "numpy>=1.26",
    "claricase-platform-shared",
    "claricase-models",
]

[project.optional-dependencies]
# Kept out of the base install so host-side tests (which use a fake encoder)
# do not need torch. The Dockerfile installs this extra.
encoder = [
    "sentence-transformers>=3,<6",
]
test = [
    "pytest>=8",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
