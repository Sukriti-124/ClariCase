[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-api"
version = "0.0.1"
description = "ClariCase ensemble-api: stacks the model services into one team, gates auto-routing, and corrects for label shift."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.29,<1",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "scikit-learn==1.9.1",   # MUST match the version the gate was saved with
    "joblib>=1.3,<2",
    "numpy>=1.26",
    "claricase-platform-shared",
    "claricase-models",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]
