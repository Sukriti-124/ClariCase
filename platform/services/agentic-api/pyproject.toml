[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-api"
version = "0.0.1"
description = "ClariCase agentic-api: LLM choice among ML candidates, grounded in retrieved examples."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.29,<1",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scikit-learn==1.9.1",
    "joblib>=1.3,<2",
    "claricase-platform-shared",
    "claricase-models",
]

[project.optional-dependencies]
encoder = ["sentence-transformers>=3,<6"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
